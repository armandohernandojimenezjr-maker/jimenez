<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Basketball Shoes - Homepage</title>

    <style>
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Georgia, serif;
            background: linear-gradient(
                to right,
                #111111,
                #444444,
                #111111
            );
            min-height: 100vh;
        }

    
        .navbar {
            width: 100%;
            background-color: white;
            padding: 15px 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);

            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar a {
            text-decoration: none;
            color: #b22222;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 18px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .navbar a:hover {
            background-color: #b22222;
            color: white;
        }


        .content {
            width: 100%;
            min-height: calc(100vh - 60px);
            padding: 50px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }


        .box {
            background-color: white;
            width: 100%;
            max-width: 900px;
            padding: 45px 35px;
            text-align: center;
            border-radius: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        
        h1 {
            font-size: 30px;
            line-height: 1.4;
            color: #222222;
            margin-bottom: 20px;
        }

    
        .logo {
            display: block;
            width: 110px;
            height: 110px;
            object-fit: contain;
            margin: 20px auto;
        }

    
        p {
            font-size: 17px;
            line-height: 1.8;
            color: #333333;
            overflow-wrap: break-word;
        }

    
        .logout {
            display: inline-block;
            background-color: #e60000;
            color: white;
            border: none;
            padding: 14px 35px;
            margin-top: 25px;
            font-family: Georgia, serif;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
        }

        .logout:hover {
            background-color: #990000;
            transform: translateY(-2px);
        }


        @media screen and (max-width: 768px) {
            .navbar {
                padding: 10px 5px;
                gap: 4px;
            }

            .navbar a {
                font-size: 14px;
                padding: 10px 12px;
                margin: 0;
            }

            .content {
                padding: 30px 15px;
            }

            .box {
                padding: 35px 25px;
            }

            h1 {
                font-size: 26px;
            }

            p {
                font-size: 16px;
                line-height: 1.7;
            }
        }

        @media screen and (max-width: 480px) {
            .navbar {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                padding: 8px 4px;
                gap: 2px;
            }

            .navbar a {
                font-size: 10px;
                padding: 10px 2px;
                text-align: center;
                white-space: nowrap;
                border-radius: 5px;
            }

            .content {
                padding: 25px 12px;
                min-height: calc(100vh - 50px);
            }

            .box {
                width: 100%;
                padding: 28px 16px;
                border-radius: 7px;
            }

            h1 {
                font-size: 22px;
                margin-bottom: 15px;
            }

            .logo {
                width: 85px;
                height: 85px;
                margin: 15px auto;
            }

            p {
                font-size: 14px;
                line-height: 1.7;
            }

            .logout {
                width: 100%;
                max-width: 220px;
                padding: 13px 20px;
                font-size: 14px;
                margin-top: 20px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="homepage.html">🏠 HOME</a>
        <a href="about.html">ⓘ ABOUT</a>
        <a href="product.html">🛍 PRODUCT</a>
        <a href="contact.html">✉ CONTACT</a>
    </nav>


    <main class="content">
        <section class="box">

            <h1>WELCOME TO MY HOMEPAGE!</h1>

            <img
                src="images.jpg"
                alt="Basketball Shoes Website Logo"
                class="logo"
            >

            <p>
                Hello! My name is <b>ARMANDO JIMENEZ</b>.
                Welcome to my <b>BASKETBALL SHOES</b> website.
                Enjoy exploring our collection of
                <b>GOOD-QUALITY BASKETBALL SHOES</b>
                that are <b>COMFORTABLE</b> and
                <b>STYLISH</b>, suitable for basketball
                players and sports activities.
            </p>

            <button
                type="button"
                class="logout"
                onclick="window.location.href='index.html'">
                ↪ LOGOUT
            </button>

        </section>
    </main>

</body>
</html>
