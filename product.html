<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Shoes Shop</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, red, #111);
    color: #111;
    padding: 20px;
}

nav {
    background: #ff0808;
    padding: 30px 10px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-bottom: 35px;
    box-shadow: 0 5px 15px #900;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

nav a:hover {
    color: yellow;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: #00e5e5;
    border-radius: 15px;
    padding: 30px;
}

h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 35px;
}

.subtitle {
    text-align: center;
    font-size: 22px;
    margin-bottom: 35px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 5px 12px #777;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    margin-bottom: 20px;
}

.card h2 {
    font-size: 21px;
    margin-bottom: 15px;
}

.card p {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 15px;
}

.price {
    font-size: 19px;
    font-weight: bold;
    margin-top: auto;
    margin-bottom: 20px;
}

.buy {
    display: block;
    width: 100%;
    background: red;
    color: white;
    border: none;
    padding: 15px 5px;
    font-size: 17px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
}

.buy:hover {
    background: #b90000;
}

footer {
    color: white;
    text-align: center;
    padding: 30px 10px;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 18px;
    }

    h1 {
        font-size: 27px;
    }

    .subtitle {
        font-size: 17px;
    }

    .products {
        gap: 14px;
    }

    .card {
        padding: 12px;
    }

    .card img {
        height: 110px;
    }

    .card h2 {
        font-size: 16px;
    }

    .card p {
        font-size: 14px;
    }

    .price {
        font-size: 15px;
    }

    .buy {
        font-size: 14px;
        padding: 12px 3px;
    }

    nav {
        gap: 18px;
    }

    nav a {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#home">HOME</a>
    <a href="#about">ABOUT</a>
    <a href="#products">PRODUCT</a>
    <a href="#contact">CONTACT</a>
</nav>

<section class="container" id="home">

    <p class="subtitle" id="about">

    <div class="products" id="products"></div>

</section>

<footer id="contact">

    <p>© 2026 Basketball Shoes Shop</p>
</footer>

];

const productContainer = document.getElementById("products");

shoes.forEach((shoe, index) => {
    const card = document.createElement("article");
    card.className = "card";

    const image = document.createElement("img");
    image.src = shoe.image;
    image.alt = shoe.name;
    image.loading = "lazy";

    image.onerror = function() {
        this.onerror = null;
        this.src = "https://placehold.co/400x250/eeeeee/222222?text=Basketball+Shoes";
    };

    const title = document.createElement("h2");
    title.textContent = shoe.name;

    const description = document.createElement("p");
    description.textContent = shoe.description;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent = "₱ " + shoe.price.toLocaleString("en-PH") + ".00";

    const button = document.createElement("button");
    button.className = "buy";
    button.textContent = "BUY NOW";

    button.addEventListener("click", function() {
        alert(

            "\nPrice: ₱" + shoe.price.toLocaleString("en-PH") +

    });

    card.append(image, title, description, price, button);
