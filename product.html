<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Basketball Shoes Shop</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to bottom, #ff0000, #111111);
    padding: 20px;
    color: #111;
}

nav {
    background: #ff0000;
    padding: 30px 10px;
    border-radius: 15px;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px;
    margin-bottom: 35px;
    box-shadow: 0 5px 15px #900;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    font-weight: bold;
}

nav a:hover {
    color: yellow;
}

.container {
    max-width: 1100px;
    margin: auto;
    background: #00e5e5;
    border-radius: 15px;
    padding: 30px;
}

h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 25px;
}

.subtitle {
    text-align: center;
    font-size: 22px;
    margin-bottom: 35px;
}

.products {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 25px;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 5px 12px #777;
    display: flex;
    flex-direction: column;
    transition: 0.3s;
    min-width: 0;
}

.card:hover {
    transform: translateY(-5px);
}

.card img {
    width: 100%;
    height: 160px;
    object-fit: contain;
    margin-bottom: 20px;
    background: #f5f5f5;
    border-radius: 8px;
}

.card h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

.card p {
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 15px;
}

.price {
    font-size: 19px;
    font-weight: bold;
    margin-top: auto;
    margin-bottom: 20px;
}

.buy {
    width: 100%;
    background: red;
    color: white;
    border: none;
    padding: 15px 5px;
    font-size: 17px;
    cursor: pointer;
    border-radius: 3px;
}

.buy:hover {
    background: #b90000;
}

footer {
    color: white;
    text-align: center;
    padding: 30px 10px;
    line-height: 2;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .container {
        padding: 16px;
    }

    h1 {
        font-size: 27px;
    }

    .subtitle {
        font-size: 17px;
    }

    .products {
        gap: 14px;
    }

    .card {
        padding: 12px;
    }

    .card img {
        height: 110px;
    }

    .card h2 {
        font-size: 15px;
    }

    .card p {
        font-size: 13px;
    }

    .price {
        font-size: 14px;
    }

    .buy {
        font-size: 13px;
        padding: 12px 3px;
    }

    nav {
        gap: 18px;
        padding: 25px 5px;
    }

    nav a {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<nav>
    <a href="#home">HOME</a>
    <a href="#about">ABOUT</a>
    <a href="#products">PRODUCT</a>
    <a href="#contact">CONTACT</a>
</nav>

<section class="container" id="home">

    <h1>👟 BASKETBALL SHOES!</h1>

    <p class="subtitle" id="about">
        Browse our available basketball shoes.
    </p>

    <div class="products" id="products"></div>

</section>

<footer id="contact">
    <h2>Basketball Shoes Shop</h2>
    <p>Thank you for visiting our website!</p>
    <p>© 2026 Basketball Shoes Shop</p>
</footer>

const productContainer = document.getElementById("products");

shoes.forEach(function(shoe) {

    const card = document.createElement("div");
    card.className = "card";

    const img = document.createElement("img");
    img.src = shoe.image;
    img.alt = shoe.name;
    img.loading = "lazy";

    img.onerror = function() {
        this.onerror = null;
        this.src =
          "https://placehold.co/400x250/eeeeee/222222?text=Basketball+Shoes";
    };

    const title = document.createElement("h2");
    title.textContent = shoe.name;

    const description = document.createElement("p");
    description.textContent = shoe.description;

    const price = document.createElement("div");
    price.className = "price";
    price.textContent =
        "₱ " + shoe.price.toLocaleString("en-PH") + ".00";

    const button = document.createElement("button");
    button.className = "buy";
    button.textContent = "BUY NOW";

    button.addEventListener("click", function() {
        alert(
            "Product: " + shoe.name +
            "\nPrice: ₱" + shoe.price.toLocaleString("en-PH") +
            "\n\nThis is a demo only. No purchase was made."
        );
    });

    card.appendChild(img);
    card.appendChild(title);
    card.appendChild(description);
    card.appendChild(price);
    card.appendChild(button);

    productContainer.appendChild(card);
});
