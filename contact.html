
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #ffffff 0%,
                #ff4b4b 25%,
                #777777 50%,
                #111111 75%,
                #00ffff 100%
            );
            color: #222;
            padding-bottom: 40px;
        }


        .navbar {
            width: 100%;
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 8px;
            padding: 20px 10px;
            background: white;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }

        .navbar a {
            color: darkred;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            padding: 5px;
            transition: 0.3s;
        }

        .navbar a:hover {
            color: #ff0000;
        }

        .navbar a.active {
            color: #ff0000;
            border-bottom: 3px solid #ff0000;
        }

    
        .contact-box {
            width: 650px;
            max-width: calc(100% - 30px);
            margin: 45px auto;
            padding: 45px;
            background: rgba(255, 255, 255, 0.94);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(10px);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00ffff, #008cff);
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(0, 140, 255, 0.4);
        }

        .logo span {
            font-size: 40px;
        }

        h1 {
            font-size: 38px;
            color: #111;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        p {
            color: #555;
            line-height: 1.7;
            font-size: 16px;
            margin-bottom: 25px;
        }

        form {
            text-align: left;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #222;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background-color: #f8f8f8;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            border-color: #00bcd4;
            background-color: white;
            box-shadow: 0 0 0 4px rgba(0, 188, 212, 0.15);
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #00bcd4, #007bff);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 8px 18px rgba(0, 123, 255, 0.3);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 123, 255, 0.45);
        }

    
        @media (max-width: 480px) {
            .navbar {
                padding: 16px 4px;
                gap: 2px;
            }

            .navbar a {
                font-size: 12px;
                padding: 4px 2px;
            }

            .contact-box {
                margin: 25px auto;
                padding: 30px 22px;
                border-radius: 22px;
            }

            h1 {
                font-size: 30px;
            }

            h2 {
                font-size: 20px;
            }

            p {
                font-size: 14px;
            }

            .logo {
                width: 70px;
                height: 70px;
            }

            .logo span {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="homepage.html">🏠 HOME</a>
        <a href="about.html">ⓘ ABOUT</a>
        <a href="product.html">🛍️ PRODUCT</a>
        <a href="contact.html" class="active">✉ CONTACT</a>
    </nav>
    <main class="contact-box">

        <h1>Contact Us!</h1>

        <div class="logo">
            <span>⭐</span>
        </div>

        <h2>Have Questions or Feedback? 💬</h2>

        <p>
            We love to hear from you! Your questions, suggestions,
            and feedback are important to us. Feel free to reach out
            and share your thoughts. We're always happy to listen
            and connect with you.
        </p>

        <form id="contactForm">

            <div class="form-group">
                <label for="name">Name</label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="message">Message</label>
                <textarea
                    id="message"
                    name="message"
                    placeholder="Enter your message here..."
                    required
                ></textarea>
            </div>

            <button type="submit">Send Message ✈️</button>

        </form>

    </main>

    <script>
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();

            alert("Thank you for your message! Your form has been submitted.");

            this.reset();
        });
    </script>

</body>
</html>
